---
# Machine profile:
#   workstation — full desktop setup (casks, MAS apps, Karabiner, macOS prefs)
#   server      — headless box: formulae only, no GUI apps, hostname left alone
profile: workstation

# Formulae installed only on the workstation profile (skipped on servers).
workstation_only_formulae:
  - shivammathur/extensions/xdebug@8.5

# Composer global packages installed only on the workstation profile.
# valet serves .test domains through nginx+dnsmasq — desktop-only, and it
# currently conflicts with the symfony 8 that laravel/installer pulls in.
workstation_only_composer_packages:
  - laravel/valet

hostname: deligoez-mac
git_email: ye@deligoz.me
timezone: Europe/Istanbul
region: TR
languages:
  - en-TR
  - tr-TR
  - de-DE
keyboard_layouts:
  - name: ABC
    id: 252
  - name: Turkish-QWERTY-PC
    id: -36
  - name: German
    id: 3
